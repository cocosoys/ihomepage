ihomepages.command.homepage.detail: "Homepage list view and switching management\n  /soyshttp homepage list          —— list all recorded homepage locations\n  /soyshttp homepage set <name>   —— switch to the specified homepage (writes homepage.current + syncs web.home + reload)\n  /soyshttp homepage info          —— show the current homepage name\n  /soyshttp homepage reload        —— re-apply the current homepage (refresh web.home from homepage.current, no switch)\nexamples:\n  /soyshttp homepage list\n  /soyshttp homepage set default\n  /soyshttp homepage reload"
ihomepages.command.homepage.item: "  §7- §f{0}{1}"
ihomepages.command.homepage.list-title: "§aRecorded homepages:"
