ihomepages.command.homepage.reloaded: "§aRe-applied web.home from the current homepage."
ihomepages.command.homepage.set-usage: "§cUsage: /{0} homepage set <homepage-name>"
ihomepages.command.homepage.switched: "§aSwitched to homepage: §f{0}§a (web.home synced and reloaded)"
