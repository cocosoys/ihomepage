# ihomepages English language pack
# All keys are prefixed with "ihomepages." (merged into the host I18n default scope to avoid key collisions).
# Placeholders are positional {0} {1}; color codes are written as § directly; values are double-quoted.

# ===== /soyshttp homepage subcommand: homepage management =====
ihomepages.command.homepage.current: "§aCurrent homepage: §f{0}"
