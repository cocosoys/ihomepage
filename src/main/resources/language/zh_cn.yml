# ihomepages 中文语言包（键与代码中 I18n.t / msgT / infoT / warnT 的 key 一一对应）
# 本文件由 MyHomePages 启动时注册为宿主 I18n 的额外语言源（合并进默认作用域），
# 因此键必须是「去前缀」原始键；请勿使用 gift.* / exception.* 等宿主占用的键空间。

