# ihomepages 逻辑配置：仅控制本功能是否启用及缓存等逻辑参数。
# 首页展示内容（标题/简介/QQ/礼包物品等）全部在 home.yml 中配置。
enabled: true
cache-seconds: 0

homepage:
  # 当前生效的主页名称（须存在于下方 pages 中；留空/不存在则自动回退 "default"）。
  current: "default"

  # 主页位置映射：主页名 -> 位置描述，支持三种取值：
  #   1) 相对路径：相对本插件数据目录（plugins/ihomepages/）解析为绝对路径。
  #      例如 dist/index.html 即 plugins/ihomepages/dist/index.html
  #      （首次启动自动从 jar 释放的内置模板，可直接编辑，编辑后刷新页面或 /soyshttp homepage reload 生效）；
  #   2) 绝对路径：如 D:/server/home/alt.html（伺服指定磁盘文件，路径须以盘符/斜杠开头）；
  #   3) 网络 URL：如 https://example.com/home.html（按需拉取并缓存 5 分钟，失败回退默认首页）。
  # 缺少 "default" 键时自动补 default -> dist/index.html。
  pages:
    default: "dist/index.html"
    # 区块世界落地页：pages/landing/ Vue3 工程构建产物，随 jar 发布到磁盘 pages-dist/landing/。
    # 用 /soyshttp homepage set landing 切换；source 工程见项目根 pages/landing/。
    landing: "pages-dist/landing/index.html"
    # ---- 六类玩法主页（pages/ 下各独立 Vue3 工程构建产物，随 jar 发布）----
    # 管理员用 /soyshttp homepage set <name> 切换，或在 ERP 配置菜单「首页内容」选择。
    tower: "pages-dist/tower/index.html"          # 魔塔：塔剖面逐层点亮 + 逐字砸入（像素硬边）
    pixel: "pages-dist/pixel/index.html"          # 神奇宝贝：精灵球爆闪弹出（街机）
    tech: "pages-dist/tech/index.html"            # 科技：BIOS 终端启动序列（AE2/Mek/Create/IC2）
    magic: "pages-dist/magic/index.html"          # 魔法：粒子汇聚成字→消散（Thaum/Botania/Astral）
    multiverse: "pages-dist/multiverse/index.html" # 多世界：五传送门轮播（原版纹理）
    rpg: "pages-dist/rpg/index.html"              # 属性 RPG：游戏 HUD（本轮原版纹理，龙珠/火影后续）
    dragonball: "pages-dist/dragonball/index.html" # 龙珠 C：龟派气功单镜头爆发（three.js 体素渲染，pages/dragonball/）
    naruto: "pages-dist/naruto/index.html"        # 火影 C：开眼→万花筒→须佐能乎（pages/naruto/）
    blockworld: "pages-dist/blockworld/index.html" # 混合 mod：末地传送门 18 柱→门启动→4 世界轮播（pages/blockworld/）
    gallery: "pages-dist/gallery/index.html"      # 混合 mod：龙珠 VS 火影 集结→对决→VS 定格（pages/gallery/）
    # alt: "D:/server/home/alt.html"
    # remote: "https://example.com/home.html"
